# /etc/nginx/sites-available/hopegestion
# Copier ce fichier sur le VPS puis : ln -s /etc/nginx/sites-available/hopegestion /etc/nginx/sites-enabled/

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name hopegestion.com www.hopegestion.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Frontend (React SPA)
server {
    listen 443 ssl http2;
    server_name hopegestion.com www.hopegestion.com;

    ssl_certificate     /etc/letsencrypt/live/hopegestion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hopegestion.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hopegestion/frontend/dist;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Cache long pour les assets compilés (Vite génère des noms avec hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Upload de fichiers jusqu'à 50 Mo
        client_max_body_size 50M;
    }

    # Uploads locaux (si DigitalOcean Spaces pas encore configuré)
    location /uploads/ {
        alias /var/www/hopegestion/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # React Router — toutes les autres routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
