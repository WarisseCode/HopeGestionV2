# /etc/nginx/sites-available/hopegestion
# Copier ce fichier sur le VPS puis : ln -s /etc/nginx/sites-available/hopegestion /etc/nginx/sites-enabled/

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name hopegestion.com www.hopegestion.com 82.29.177.34;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Frontend (React SPA)
server {
    listen 443 ssl http2;
    server_name hopegestion.com www.hopegestion.com 82.29.177.34;

    ssl_certificate     /etc/letsencrypt/live/hopegestion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hopegestion.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hopegestion/frontend/dist;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Cache long pour les assets compilés (Vite génère des noms avec hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        # En-têtes de sécurité (audit S8) — fichiers (bloc avec son propre add_header : rien n'est hérité)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Upload de fichiers jusqu'à 50 Mo
        client_max_body_size 50M;
    }

    # Uploads locaux — fichiers privés (audit S7, docs/suivi/FICHIERS_PRIVES_ETAPE3.md)
    # « ^~ » indispensable sur les deux blocs : sans lui, la règle par motif des fichiers
    # statiques (~* \.(png|jpg|…)$ plus haut) l'emporte, cherche les fichiers dans
    # frontend/dist et renvoie 404.
    #
    # Photos des biens : publiques (annonces des lots vacants), servies directement.
    location ^~ /uploads/properties/ {
        # En-têtes de sécurité (audit S8) — fichiers (bloc avec son propre add_header : rien n'est hérité)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /var/www/hopegestion/backend/uploads/properties/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Tous les autres fichiers (pièces d'identité, quittances, baux, signatures…) :
    # transmis à Node, qui vérifie la signature du lien (?exp=…&sig=…) quand
    # FILE_URLS_ENFORCE=true. Pas de cache public : Node envoie « private ».
    location ^~ /uploads/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router — toutes les autres routes → index.html
    location / {
        # En-têtes de sécurité (audit S8) — page du site
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-2TsBzjn30B3jBh9yoAA8EZ3d/IxXIaS0TmYaXiXc6I0=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
        try_files $uri $uri/ /index.html;
    }
}
