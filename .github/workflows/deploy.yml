name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          set -e
          export HOME=/root
          export PM2_HOME=/root/.pm2
          cd /var/www/hopegestion
          git fetch origin main && git reset --hard origin/main

          # ── Backend ──
          cd /var/www/hopegestion/backend
          rm -rf dist
          npm ci
          npm run build
          npm prune --omit=dev
          timeout 120 npm run migrate-prod || echo "migrate-prod non bloquant"
          pm2 restart hopegestion-backend --update-env && pm2 save

          # ── Frontend ──
          cd /var/www/hopegestion/frontend
          npm ci --legacy-peer-deps
          rm -rf node_modules/.vite
          source .env && npm run build

          # ── Nginx ──
          nginx -t && systemctl reload nginx
          echo "✅ Déploiement terminé"
