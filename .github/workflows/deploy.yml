name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  # ── Tests backend AVANT toute modification du serveur ─────────────────────────
  # Ils tournent sur une machine GitHub vierge, et non sur le VPS : pas de .env de
  # production (clés Spaces, SMTP…), pas de base réelle, pas de dossier uploads/.
  # Sur le VPS, le test d'upload enverrait un vrai fichier vers Spaces. Si un test
  # échoue, le job « deploy » ne démarre pas : le site en ligne reste intact.
  test:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer et lancer les tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          set -e
          export HOME=/home/hopegestion
          export PM2_HOME=/home/hopegestion/.pm2
          cd /var/www/hopegestion
          git fetch origin main && git reset --hard origin/main

          # ── Backend ──
          cd /var/www/hopegestion/backend
          rm -rf dist
          npm ci
          npm run build
          npm prune --omit=dev
          timeout 120 npm run migrate-prod || echo "migrate-prod non bloquant"
          pm2 restart hopegestion-backend --update-env && pm2 save

          # ── Frontend ──
          cd /var/www/hopegestion/frontend
          npm ci --legacy-peer-deps
          rm -rf node_modules/.vite
          source .env && npm run build

          # ── Nginx ──
          nginx -t && systemctl reload nginx
          echo "✅ Déploiement terminé"
