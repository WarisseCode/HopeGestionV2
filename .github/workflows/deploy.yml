name: Deploy to OVH VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Build Frontend ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      # ── 3. Build Backend ─────────────────────────────────────────────────────
      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      # ── 4. Deploy via SSH ────────────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e
            echo "==> Mise à jour du code..."
            cd /var/www/hopegestion
            git pull origin main

            echo "==> Installation dépendances backend..."
            cd /var/www/hopegestion/backend
            npm ci

            echo "==> Build backend..."
            npm run build

            echo "==> Suppression devDependencies..."
            npm prune --omit=dev

            echo "==> Migrations base de données..."
            npm run migrate-prod

            echo "==> Redémarrage PM2..."
            pm2 restart hopegestion-backend --update-env
            pm2 save

            echo "==> Build frontend..."
            cd /var/www/hopegestion/frontend
            npm ci
            VITE_API_URL=${{ secrets.VITE_API_URL }} VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} npm run build

            echo "==> Rechargement nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Déploiement terminé !"
