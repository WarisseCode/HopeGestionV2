name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Vérification build Frontend (CI) ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      # ── 3. Vérification build Backend (CI) ──────────────────────────────────
      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      # ── 4. Déclencher le déploiement via webhook HTTPS (sans SSH) ───────────
      - name: Deploy to VPS
        run: |
          curl -X POST https://hopegestion.com/api/deploy \
            -H "x-deploy-token: ${{ secrets.DEPLOY_TOKEN }}" \
            --max-time 30 \
            --fail \
            --show-error
